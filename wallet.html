<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-color: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    display: flex;
    width: 900px;
    background-color: #fff;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.sidebar {
    width: 250px;
    background-color: #fafafa;
    padding: 20px;
    border-right: 1px solid #e0e0e0;
}

.sidebar .profile {
    text-align: center;
    margin-bottom: 20px;
}

.sidebar .profile img {
    border-radius: 50%;
    width: 100px;
    height: 100px;
}

.sidebar .profile h3 {
    margin-top: 10px;
    font-size: 18px;
    color: #333;
}

.sidebar nav ul {
    list-style: none;
}

.sidebar nav ul li {
    margin-bottom: 15px;
}

.sidebar nav ul li a {
    color: #333;
    text-decoration: none;
    font-size: 16px;
    display: flex;
    align-items: center;
}

.sidebar nav ul li a i {
    margin-right: 10px;
    font-size: 18px;
}

.main-content {
    flex: 1;
    padding: 20px;
}

.balance-rewards {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.balance-box, .reward-box, .pending-box {
    background-color: #ccc;
    padding: 20px;
    text-align: center;
    flex: 1;
    margin: 0 10px;
    border-radius: 5px;
    color: #fff;
}

.reward-box {
    background-color: #28a745;
}

.pending-box {
    background-color: #dc3545;
}

.add-balance-btn {
    background-color: #f5f5f5;
    border: 1px solid #ccc;
    padding: 10px 15px;
    border-radius: 5px;
    color: #333;
    cursor: pointer;
    margin-top: 10px;
    display: flex;
    align-items: center;
}

.add-balance-btn i {
    margin-right: 5px;
}

.payment-history {
    margin-bottom: 20px;
}

.payment-history h3 {
    margin-bottom: 10px;
    font-size: 20px;
}

.payment-history p {
    margin-bottom: 5px;
    color: #666;
}

.payment-history a {
    color: #28a745;
    text-decoration: none;
}

.prime-benefits {
    margin-top: 20px;
}

.prime-benefits h3 {
    margin-bottom: 20px;
    font-size: 20px;
}

.benefit {
    margin-bottom: 20px;
}

.benefit i {
    font-size: 24px;
    color: #b6dc97;
    margin-right: 10px;
}

.benefit p {
    display: inline-block;
    vertical-align: top;
    width: calc(100% - 40px);
    color: #333;
    margin-bottom: 5px;
}

.benefit a {
    color: #28a745;
    text-decoration: none;
}

    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="balance-rewards">
                <div class="balance-box">
                    <h2>$74.57</h2>
                    <p>Available Balance</p>
                </div>
                <div class="reward-box">
                    <h2>$5.00</h2>
                    <p>Reward Balance</p>
                </div>
                <div class="pending-box">
                    <h2>$0.00</h2>
                    <p>Pending Balance</p>
                </div>
                <button class="add-balance-btn"><i class="fas fa-plus-circle"></i> Add Balance</button>
            </div>
            <div class="payment-history">
                <h3>Payment History</h3>
                <p>Last payment: June 07, 2017</p>
                <a href="#">View printable receipt</a>
            </div>
        </div>
    </div>
</body>
</html>
