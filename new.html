     Primary image upload with cropping
<div class="col-lg-12">
    <div class="card mb-4">
        <div class="card-header">
            <h4>Select Primary Image</h4>
        </div>
        <div class="card-body">
            <div class="input-upload text-start">
                <label for="image1" class="form-label">
                    <img id="preview1" src="../assets/imgs/theme/upload.svg" alt="" width="150px">
                </label>
                <input type="file" class="form-control" id="image1" style="display: none;" name="primaryImage" onchange="prepareImageForCropping('image1', 'preview1')">
                <button type="button" class="btn btn-md rounded font-sm" onclick="document.getElementById('image1').click();">Upload Image</button>
            </div>
            <div id="primaryImage_error" class="error-message" style="color: red; display: none;">Primary image is required.</div>
        </div>
    </div>
</div>

<!-- Secondary images upload -->
<div id="secondary-images-container" class="col-lg-12">
    <div class="card mb-4" id="secondary-image-card-1">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4>Select Secondary Image 1</h4>
            <button type="button" class="btn btn-danger btn-sm" onclick="removeSecondaryImage(1)">Delete</button>
        </div>
        <div class="card-body">
            <div class="input-upload text-start">
                <label for="image2" class="form-label">
                    <img id="preview2" src="../assets/imgs/theme/upload.svg" alt="" width="150px">
                </label>
                <input type="file" class="form-control" id="image2" name="images" style="display: none;" onchange="prepareImageForCropping('image2', 'preview2')">
                <button type="button" class="btn btn-md rounded font-sm" onclick="document.getElementById('image2').click();">Upload Image</button>
            </div>
        </div>
    </div>
</div>

<button type="button" class="btn btn-primary" id="add-secondary-image-btn">Add Another Secondary Image</button>

<!-- Image Crop Modal -->
<div class="modal fade" id="imageCropModal" tabindex="-1" aria-labelledby="imageCropModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="imageCropModalLabel">Crop Image</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <img id="imageToCrop" src="" alt="Crop this image" style="max-width: 100%;">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="cropImageBtn">Crop</button>
            </div>
        </div>
    </div>
</div>
<script defer>
  document.addEventListener("DOMContentLoaded", function () {
    let currentInputId, currentPreviewId, cropper;
    let croppedImages = {};
    let originalFileNames = {};
    let secondaryImageCount = 1;

    // Initialize Cropper when modal is shown
    $('#imageCropModal').on('shown.bs.modal', function () {
        let image = document.getElementById('imageToCrop');
        cropper = new Cropper(image, {
            aspectRatio: 1,
            viewMode: 1,
            dragMode: "move",
            minContainerWidth: 450,
            minContainerHeight: 500,
            minCropBoxWidth: 400,
            minCropBoxHeight: 400,
            minCanvasHeight: 500,
            minCanvasWidth: 500,
        });
    });

    // Destroy Cropper when modal is hidden
    $('#imageCropModal').on('hidden.bs.modal', function () {
        if (cropper) {
            cropper.destroy();
            cropper = null;
        }
    });

    // Prepare image for cropping
    function prepareImageForCropping(inputId, previewId) {
        currentInputId = inputId;
        currentPreviewId = previewId;
        const input = document.getElementById(inputId);
        const file = input.files[0];
        const newDate = new Date().getTime();
        originalFileNames[inputId] = `${file.name}_${newDate}`;

        const reader = new FileReader();
        reader.onload = function (e) {
            document.getElementById('imageToCrop').src = e.target.result;
            $('#imageCropModal').modal('show');
        };
        reader.readAsDataURL(file);
    }

    // Perform the cropping
    function performCropping() {
        if (!cropper) {
            console.error("Cropper is not initialized.");
            return;
        }

        cropper.getCroppedCanvas().toBlob((blob) => {
            const previewId = currentPreviewId;
            const file = new File([blob], originalFileNames[currentInputId], { type: 'image/png' });

            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            document.getElementById(currentInputId).files = dataTransfer.files;

            const preview = document.getElementById(currentPreviewId);
            preview.src = URL.createObjectURL(blob);

            croppedImages[currentInputId] = blob;
            $('#imageCropModal').modal('hide');
        }, 'image/png');
    }

    // Add a new secondary image upload card
    function addSecondaryImage() {
        secondaryImageCount++;
        const container = document.getElementById('secondary-images-container');
        const newImageId = `image${secondaryImageCount + 1}`;
        const newPreviewId = `preview${secondaryImageCount + 1}`;
        const cardId = `secondary-image-card-${secondaryImageCount}`;

        const newImageCard = document.createElement('div');
        newImageCard.className = 'card mb-4';
        newImageCard.id = cardId;
        newImageCard.innerHTML = `
            <div class="card-header d-flex justify-content-between align-items-center">
                <h4>Select Secondary Image ${secondaryImageCount}</h4>
                <button type="button" class="btn btn-danger btn-sm" onclick="removeSecondaryImage(${secondaryImageCount})">Delete</button>
            </div>
            <div class="card-body">
                <div class="input-upload text-start">
                    <label for="${newImageId}" class="form-label">
                        <img id="${newPreviewId}" src="../assets/imgs/theme/upload.svg" alt="" width="150px">
                    </label>
                    <input type="file" class="form-control" id="${newImageId}" name="images" style="display: none;" onchange="prepareImageForCropping('${newImageId}', '${newPreviewId}')">
                    <button type="button" class="btn btn-md rounded font-sm" onclick="document.getElementById('${newImageId}').click();">Upload Image</button>
                </div>
            </div>
        `;
        container.appendChild(newImageCard);
    }

    // Remove a secondary image upload card
    function removeSecondaryImage(index) {
        const card = document.getElementById(`secondary-image-card-${index}`);
        if (card) {
            card.remove();
            secondaryImageCount--;
        }
    }

    // Event listeners
    document.getElementById('image1').addEventListener('change', function () { 
        prepareImageForCropping('image1', 'preview1'); 
    });

    document.getElementById('add-secondary-image-btn').addEventListener('click', addSecondaryImage);

    document.getElementById('cropImageBtn').addEventListener('click', performCropping);
});

</script>
